name: Build and Deploy to OCI

on:
  push:
    branches: [ "main" ]   # main 브랜치에 push되면 실행

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm  # ARM64 네이티브 runner

    steps:
      # 1. 레포 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 테스트 실행 (테스트 실패 → 이후 단계 전부 중단)
      - name: Run Tests
        run: ./gradlew test --no-daemon
        working-directory: ./BE

      # 4. DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 5. Backend 이미지 빌드 & push
      - name: Build and push backend docker image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-backend:latest ./BE
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-backend:latest

      # 6. Crawler 이미지 빌드 & push
      - name: Build and push crawler docker image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-crawler:latest ./crawler
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-crawler:latest

  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      # 7. 레포 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 8. Blue(자기 자신) 환경변수 + compose 파일 준비
      - name: Prepare Blue instance files
        run: |
          mkdir -p /home/ubuntu/safe-trip
          echo "${{ secrets.ENV_BACKEND_FILE }}" > /home/ubuntu/safe-trip/.env.backend
          echo "${{ secrets.ENV_CRAWLER_FILE }}" > /home/ubuntu/safe-trip/.env.crawler
          cp ${{ github.workspace }}/docker-compose.prod.yml /home/ubuntu/safe-trip/

      # 9. Green 인스턴스에 환경변수 + compose 파일 전송
      - name: Prepare Green instance files
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@${{ vars.GREEN_IP }} "mkdir -p /home/ubuntu/safe-trip"
          echo "${{ secrets.ENV_BACKEND_FILE }}" > /tmp/.env.backend
          echo "${{ secrets.ENV_CRAWLER_FILE }}" > /tmp/.env.crawler
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            /tmp/.env.backend \
            ubuntu@${{ vars.GREEN_IP }}:/home/ubuntu/safe-trip/.env.backend
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            /tmp/.env.crawler \
            ubuntu@${{ vars.GREEN_IP }}:/home/ubuntu/safe-trip/.env.crawler
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ github.workspace }}/docker-compose.prod.yml \
            ubuntu@${{ vars.GREEN_IP }}:/home/ubuntu/safe-trip/
          rm /tmp/.env.backend /tmp/.env.crawler

      # 10. Blue-Green 배포 스크립트 실행
      - name: Blue-Green Deploy
        env:
          BLUE_IP: ${{ vars.BLUE_IP }}
          GREEN_IP: ${{ vars.GREEN_IP }}
        run: |
          chmod +x ${{ github.workspace }}/scripts/deploy-blue-green.sh
          ${{ github.workspace }}/scripts/deploy-blue-green.sh

      # 11. Cron Job 설정 (daily ETL, UTC 02:00)
      - name: Setup crawler cron job
        run: |
          (crontab -l 2>/dev/null | grep -qF "daily_etl_pipeline") || \
          (crontab -l 2>/dev/null; echo "0 2 * * * cd /home/ubuntu/safe-trip && docker compose -f docker-compose.prod.yml run --rm crawler python src/daily_etl_pipeline.py >> /home/ubuntu/safe-trip/crawler.log 2>&1") | crontab -
