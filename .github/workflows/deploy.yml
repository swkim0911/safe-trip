name: Build and Deploy to OCI

on:
  push:
    branches: [ "main" ]   # main 브랜치에 push되면 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 레포 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. JDK 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # 3. 테스트 실행 (테스트 실패 → 이후 단계 전부 중단)
      - name: Run Tests
        run: ./gradlew test --no-daemon
        working-directory: ./BE

       # 4. DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 5. Backend 이미지 빌드 (테스트 제외)
      - name: Build backend docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-backend:latest ./BE

      # 6. Crawler 이미지 빌드
      - name: Build crawler docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-crawler:latest ./crawler

      # 7. DockerHub에 push
      - name: Push backend image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-backend:latest

      - name: Push crawler image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-crawler:latest

      # 8. OCI safetrip-server로 docker-compose 파일 업로드
      - name: Copy compose file to OCI
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "./docker-compose.prod.yml"
          target: "/home/ubuntu/safe-trip/"

      # 9. OCI safetrip-server에 배포
      - name: Deploy to OCI
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd /home/ubuntu/safe-trip
            # Secrets 내용으로 .env 파일 복원
            echo "${{ secrets.ENV_BACKEND_FILE }}" > .env.backend
            echo "${{ secrets.ENV_CRAWLER_FILE }}" > .env.crawler

            # 최신 이미지 pull & compose 실행
            docker-compose -f docker-compose.prod.yml pull backend
            docker-compose -f docker-compose.prod.yml pull crawler
            docker-compose -f docker-compose.prod.yml up -d backend
