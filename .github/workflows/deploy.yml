name: Build and Deploy to OCI

on:
  push:
    branches: [ "main" ]   # main 브랜치에 push되면 실행

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm  # ARM64 네이티브 runner

    steps:
      # 1. 레포 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 테스트 실행 (테스트 실패 → 이후 단계 전부 중단)
      - name: Run Tests
        run: ./gradlew test --no-daemon
        working-directory: ./BE

      # 4. DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 5. Backend 이미지 빌드 & push
      - name: Build and push backend docker image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-backend:latest ./BE
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-backend:latest

      # 6. Crawler 이미지 빌드 & push
      - name: Build and push crawler docker image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-crawler:latest ./crawler
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-crawler:latest

  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      # 7. 레포 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 8. Runner / Remote 양쪽 인스턴스에 동일한 파일 배치
      #    한 단계에서 두 대상에 같은 함수를 호출해 비대칭 누락을 구조적으로 차단
      - name: Prepare both instances
        run: |
          # 1) runner의 /tmp에 한 번만 staging
          echo "${{ secrets.ENV_BACKEND_FILE }}" > /tmp/.env.backend
          echo "${{ secrets.ENV_CRAWLER_FILE }}" > /tmp/.env.crawler
          cp ${{ github.workspace }}/docker-compose.prod.yml /tmp/docker-compose.prod.yml

          # 2) 대상별 동일 동작 (local = runner 인스턴스, ssh = remote 인스턴스)
          #    crawler 이미지도 같이 pull — cron이 캐시된 옛 이미지로 ETL을 돌리지 않도록
          deploy_files() {
            local target=$1
            if [ "$target" = "local" ]; then
              mkdir -p /home/ubuntu/safe-trip
              cp /tmp/.env.backend /tmp/.env.crawler /tmp/docker-compose.prod.yml /home/ubuntu/safe-trip/
              docker compose -f /home/ubuntu/safe-trip/docker-compose.prod.yml pull crawler
            else
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@$target "mkdir -p /home/ubuntu/safe-trip"
              scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
                /tmp/.env.backend /tmp/.env.crawler /tmp/docker-compose.prod.yml \
                ubuntu@$target:/home/ubuntu/safe-trip/
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ubuntu@$target \
                "docker compose -f /home/ubuntu/safe-trip/docker-compose.prod.yml pull crawler"
            fi
          }

          deploy_files local
          deploy_files ${{ vars.REMOTE_IP }}

          # 3) staging 정리
          rm /tmp/.env.backend /tmp/.env.crawler /tmp/docker-compose.prod.yml

      # 9. Blue-Green 배포 스크립트 실행
      - name: Blue-Green Deploy
        env:
          RUNNER_IP: ${{ vars.RUNNER_IP }}
          REMOTE_IP: ${{ vars.REMOTE_IP }}
        run: |
          chmod +x ${{ github.workspace }}/scripts/deploy-blue-green.sh
          ${{ github.workspace }}/scripts/deploy-blue-green.sh

      # 10. Cron Job 설정 (daily ETL, UTC 02:00)
      #     의도적으로 runner 인스턴스 전용 — self-hosted runner의 crontab에만 등록되며,
      #     LB가 remote 인스턴스를 active로 전환해도 ETL은 항상 runner 인스턴스에서 실행된다.
      #     runner 인스턴스 교체 시 워크플로 재실행 필요 (grep -qF 체크로 idempotent).
      - name: Setup crawler cron job
        run: |
          (crontab -l 2>/dev/null | grep -qF "daily_etl_pipeline") || \
          (crontab -l 2>/dev/null; echo "0 2 * * * cd /home/ubuntu/safe-trip && docker compose -f docker-compose.prod.yml run --rm crawler python src/daily_etl_pipeline.py >> /home/ubuntu/safe-trip/crawler.log 2>&1") | crontab -
