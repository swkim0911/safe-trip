name: Build and Deploy to OCI

on:
  push:
    branches: [ "main" ]   # main 브랜치에 push되면 실행

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 레포 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 테스트 실행 (테스트 실패 → 이후 단계 전부 중단)
      - name: Run Tests
        run: ./gradlew test --no-daemon
        working-directory: ./BE

      # 4. Docker Buildx 세팅 (멀티 플랫폼 빌드용)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 6. Backend 이미지 빌드 & push (ARM64)
      - name: Build and push backend docker image
        uses: docker/build-push-action@v5
        with:
          context: ./BE
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-backend:latest

      # 7. Crawler 이미지 빌드 & push (ARM64)
      - name: Build and push crawler docker image
        uses: docker/build-push-action@v5
        with:
          context: ./crawler
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-crawler:latest

  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      # 8. 레포 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 9. 배포 디렉토리로 이동 및 환경변수 파일 생성
      - name: Write env files
        run: |
          mkdir -p /home/ubuntu/safe-trip
          echo "${{ secrets.ENV_BACKEND_FILE }}" > /home/ubuntu/safe-trip/.env.backend
          echo "${{ secrets.ENV_CRAWLER_FILE }}" > /home/ubuntu/safe-trip/.env.crawler

      # 10. docker-compose 파일 복사
      - name: Copy compose file
        run: cp ${{ github.workspace }}/docker-compose.prod.yml /home/ubuntu/safe-trip/

      # 11. 최신 이미지 pull & 재시작
      - name: Deploy
        run: |
          cd /home/ubuntu/safe-trip
          docker-compose -f docker-compose.prod.yml pull backend
          docker-compose -f docker-compose.prod.yml pull crawler
          docker-compose -f docker-compose.prod.yml up -d backend
