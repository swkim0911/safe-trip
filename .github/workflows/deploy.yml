name: Build and Deploy to OCI

on:
  push:
    branches: [ "main" ]   # main 브랜치에 push되면 실행

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm  # ARM64 네이티브 runner

    steps:
      # 1. 레포 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 테스트 실행 (테스트 실패 → 이후 단계 전부 중단)
      - name: Run Tests
        run: ./gradlew test --no-daemon
        working-directory: ./BE

      # 4. DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 5. Backend 이미지 빌드 & push
      - name: Build and push backend docker image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-backend:latest ./BE
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-backend:latest

      # 6. Crawler 이미지 빌드 & push
      - name: Build and push crawler docker image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-crawler:latest ./crawler
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/safetrip-crawler:latest

  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      # 7. 레포 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 8. 배포 디렉토리 및 환경변수 파일 생성
      - name: Write env files
        run: |
          mkdir -p /home/ubuntu/safe-trip
          echo "${{ secrets.ENV_BACKEND_FILE }}" > /home/ubuntu/safe-trip/.env.backend
          echo "${{ secrets.ENV_CRAWLER_FILE }}" > /home/ubuntu/safe-trip/.env.crawler

      # 9. docker-compose 파일 복사
      - name: Copy compose file
        run: cp ${{ github.workspace }}/docker-compose.prod.yml /home/ubuntu/safe-trip/

      # 10. 최신 이미지 pull & 재시작 (docker compose v2)
      - name: Deploy
        run: |
          cd /home/ubuntu/safe-trip
          docker compose -f docker-compose.prod.yml pull backend
          docker compose -f docker-compose.prod.yml pull crawler
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d backend
