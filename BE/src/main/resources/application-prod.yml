spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/aggregate-schema.sql

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

oci:
  storage:
    access-key: ${OCI_ACCESS_KEY}
    secret-key: ${OCI_SECRET_KEY}
    endpoint: ${OCI_STORAGE_ENDPOINT}   # https://{namespace}.compat.objectstorage.{region}.oraclecloud.com
    region: ${OCI_REGION}
    bucket-name: ${OCI_BUCKET_NAME}
    base-path: ${OCI_BASE_PATH}
