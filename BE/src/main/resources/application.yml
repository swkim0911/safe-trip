spring:
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        use_sql_comments: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true