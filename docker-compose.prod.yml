version: "3.8"
services:
  backend:
    image: swkim0911/safetrip-backend:latest
    container_name: safetrip-backend
    ports:
      - "8080:8080"
    env_file:
      - ./.env.backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - safetrip-network

  crawler:
    image: swkim0911/safetrip-crawler:latest
    container_name: safetrip-crawler
    env_file:
      - ./.env.crawler
    networks:
      - safetrip-network

networks:
  safetrip-network:
    driver: bridge
